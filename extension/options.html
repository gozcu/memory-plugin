<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Page Memory settings</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="options">
    <form id="options-form">
      <label for="token">Security token</label>
      <input id="token" type="password" autocomplete="off" required />
      <div class="muted">
        Get your token at
        <a href="https://status402.io" target="_blank" rel="noreferrer">status402.io</a>.
      </div>

      <label for="salt">Salt</label>
      <input id="salt" type="password" autocomplete="off" required />
      <div class="muted">Sent with every request as the <code>x-secret-key</code> header.</div>

      <p>
        <button class="primary" type="submit">Save and test connection</button>
      </p>
      <div id="options-status" class="status" role="status"></div>
    </form>
    <script src="options.js"></script>
  </body>
</html>
