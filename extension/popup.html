<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Page Memory</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <section id="panel-save" class="container" aria-labelledby="save-title">
      <header class="container-header">
        <h1 id="save-title">Save</h1>
        <div class="header-actions">
          <button id="open-search" class="icon-button outlined" type="button" title="Search" aria-label="Search" aria-expanded="false" aria-controls="panel-search">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5" /><path d="M10 10l4 4" /></svg>
          </button>
          <button id="open-options" class="icon-button" title="Settings" aria-label="Settings">⚙</button>
        </div>
      </header>

      <div class="page-card">
        <div id="page-title" class="page-title">Reading page…</div>
        <div id="page-url" class="page-url"></div>
        <div id="page-stats" class="muted"></div>
      </div>

      <label for="description">Description</label>
      <textarea id="description" rows="4" required aria-describedby="description-hint" placeholder="Why does this matter? What should you remember?"></textarea>

      <div class="save-card">
        <div id="description-hint" class="muted"></div>
        <button id="save" class="primary" disabled>Save page</button>
      </div>
      <div id="save-status" class="status" role="status"></div>
    </section>

    <section id="panel-search" aria-labelledby="search-title" hidden>
      <div id="search-card" class="container">
        <header class="container-header">
          <h1 id="search-title">Search</h1>
          <button id="close-search" class="icon-button" type="button" title="Close search" aria-label="Close search">✕</button>
        </header>
        <form id="search-form" role="search">
          <input id="query" type="search" aria-label="Search your saved pages" placeholder="Ask about something you've saved…" autocomplete="off" />
          <button id="run-search" class="icon-button outlined" type="submit" title="Search" aria-label="Search"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5" /><path d="M10 10l4 4" /></svg></button>
          <!-- While a search runs, the bar fills the input from behind a translucent layer. -->
          <div id="search-progress-bar" class="progress" role="progressbar" aria-label="Searching" hidden><div></div></div>
        </form>
        <div id="search-progress" class="progress-info" hidden>
          <span id="search-stage" class="progress-stage" role="status"></span>
          <span id="search-elapsed" class="progress-elapsed" aria-hidden="true"></span>
        </div>
      </div>
      <div id="results-heading" class="muted"></div>
      <ul id="results"></ul>
      <div id="carousel-nav" hidden>
        <button id="carousel-prev" class="carousel-button" aria-label="Previous result">‹</button>
        <span id="carousel-count" class="muted" aria-live="polite"></span>
        <button id="carousel-next" class="carousel-button" aria-label="Next result">›</button>
      </div>
      <div id="search-status" class="status" role="status"></div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
